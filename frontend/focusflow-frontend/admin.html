<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin · FocusFlow</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230A5C5A'/><path fill='%23F4FAF9' d='M11 8h10v3h-6.6v3.2H20V17h-5.6V24H11V8z'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="topbar">
        <button class="menu-btn" type="button" data-nav-toggle aria-expanded="false" aria-controls="rail">Menu</button>
        <a class="brand" href="dashboard.html">FocusFlow</a>
        <span></span>
    </header>
    <div class="scrim" data-nav-scrim hidden></div>

    <div class="shell">
        <aside class="rail" id="rail">
            <a class="brand" href="dashboard.html">
                <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
                    <rect width="28" height="28" rx="8" fill="#0A5C5A" />
                    <path fill="#F4FAF9" d="M9.2 7h9v2.6h-6v2.8h5.4V15h-5.4V21H9.2V7z" />
                </svg>
                <span>FocusFlow</span>
            </a>
            <nav class="nav" aria-label="Main">
                <a href="dashboard.html"><i class="ph ph-house" aria-hidden="true"></i> Home</a>
                <a href="projects.html"><i class="ph ph-folders" aria-hidden="true"></i> Projects</a>
                <a href="tasks.html"><i class="ph ph-check-square" aria-hidden="true"></i> Tasks</a>
                <a href="admin.html" id="navAdmin" aria-current="page" hidden><i class="ph ph-shield" aria-hidden="true"></i> Admin</a>
            </nav>
            <div class="rail-foot">
                <div class="who">
                    <span class="who-name" data-user-name>Signed in</span>
                    <span class="who-role" data-user-role hidden>admin</span>
                </div>
                <button class="btn btn-quiet btn-dark btn-sm" type="button" data-logout>Sign out</button>
            </div>
        </aside>

        <main class="work" id="main">
            <div class="wrap">
                <header class="page-head">
                    <div>
                        <h1 class="page-title">Admin</h1>
                        <p class="page-sub">Accounts on this FocusFlow install.</p>
                    </div>
                </header>

                <div class="notice" id="adminNotice" hidden>
                    <p class="empty-title">Admin tools are for admin accounts.</p>
                    <p>Ask an administrator to change your role, then reload this page.</p>
                    <a class="btn btn-quiet" href="dashboard.html">Back to home</a>
                </div>

                <section class="panel" id="adminPanel" hidden>
                    <div class="table-wrap">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th scope="col">Name</th>
                                    <th scope="col">Email</th>
                                    <th scope="col">Role</th>
                                    <th scope="col">Status</th>
                                    <th scope="col"><span class="sr-only">Actions</span></th>
                                </tr>
                            </thead>
                            <tbody id="userTable"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div class="toast-wrap" id="toasts" aria-live="polite"></div>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/admin.js"></script>
</body>

</html>
