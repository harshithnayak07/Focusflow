<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasks · FocusFlow</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230A5C5A'/><path fill='%23F4FAF9' d='M11 8h10v3h-6.6v3.2H20V17h-5.6V24H11V8z'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="topbar">
        <button class="menu-btn" type="button" data-nav-toggle aria-expanded="false" aria-controls="rail">Menu</button>
        <a class="brand" href="dashboard.html">FocusFlow</a>
        <span></span>
    </header>
    <div class="scrim" data-nav-scrim hidden></div>

    <div class="shell">
        <aside class="rail" id="rail">
            <a class="brand" href="dashboard.html">
                <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
                    <rect width="28" height="28" rx="8" fill="#0A5C5A" />
                    <path fill="#F4FAF9" d="M9.2 7h9v2.6h-6v2.8h5.4V15h-5.4V21H9.2V7z" />
                </svg>
                <span>FocusFlow</span>
            </a>
            <nav class="nav" aria-label="Main">
                <a href="dashboard.html"><i class="ph ph-house" aria-hidden="true"></i> Home</a>
                <a href="projects.html"><i class="ph ph-folders" aria-hidden="true"></i> Projects</a>
                <a href="tasks.html" aria-current="page"><i class="ph ph-check-square" aria-hidden="true"></i> Tasks</a>
                <a href="admin.html" id="navAdmin" hidden><i class="ph ph-shield" aria-hidden="true"></i> Admin</a>
            </nav>
            <div class="rail-foot">
                <div class="who">
                    <span class="who-name" data-user-name>Signed in</span>
                    <span class="who-role" data-user-role hidden>admin</span>
                </div>
                <button class="btn btn-quiet btn-dark btn-sm" type="button" data-logout>Sign out</button>
            </div>
        </aside>

        <main class="work" id="main">
            <div class="wrap">
                <header class="page-head">
                    <div>
                        <h1 class="page-title">Tasks</h1>
                        <p class="page-sub" id="tasksSub">Mark work done as you go.</p>
                    </div>
                    <button class="btn" type="button" id="newTask">New task</button>
                </header>

                <div class="toolbar">
                    <input class="input" id="taskSearch" type="search" placeholder="Search tasks" aria-label="Search tasks">
                    <select class="input" id="taskProjectFilter" aria-label="Filter by project">
                        <option value="">All projects</option>
                    </select>
                    <div class="seg" role="group" aria-label="Filter by status">
                        <button type="button" data-status="all" aria-pressed="true">All</button>
                        <button type="button" data-status="open" aria-pressed="false">To do</button>
                        <button type="button" data-status="done" aria-pressed="false">Done</button>
                    </div>
                </div>

                <div class="t-groups" id="taskGroups"></div>

                <div class="empty" id="tasksEmpty" hidden>
                    <p class="empty-title" id="tasksEmptyTitle">No tasks yet.</p>
                    <p id="tasksEmptyText">Add a task and it shows up here.</p>
                    <button class="btn" type="button" id="tasksEmptyAction">New task</button>
                </div>
            </div>
        </main>
    </div>

    <div class="modal" id="taskModal">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
            <h2 id="taskModalTitle">New task</h2>
            <form class="modal-form" id="taskForm" novalidate>
                <div class="field">
                    <label class="field-label" for="taskName">Task</label>
                    <input class="input" id="taskName" type="text" required maxlength="200">
                </div>
                <div class="field">
                    <label class="field-label" for="taskProject">Project</label>
                    <select class="input" id="taskProject" required></select>
                </div>
                <p class="form-msg" id="taskMessage" role="alert"></p>
                <div class="modal-actions">
                    <button class="btn btn-quiet" type="button" data-close>Cancel</button>
                    <button class="btn" type="submit" id="taskSubmit">Add task</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast-wrap" id="toasts" aria-live="polite"></div>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/tasks.js"></script>
</body>

</html>
