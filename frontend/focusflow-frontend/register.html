<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account · FocusFlow</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230A5C5A'/><path fill='%23F4FAF9' d='M11 8h10v3h-6.6v3.2H20V17h-5.6V24H11V8z'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth">
    <div class="auth-art">
        <a class="brand" href="index.html">
            <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
                <rect width="28" height="28" rx="8" fill="#0A5C5A" />
                <path fill="#F4FAF9" d="M9.2 7h9v2.6h-6v2.8h5.4V15h-5.4V21H9.2V7z" />
            </svg>
            <span>FocusFlow</span>
        </a>
        <div>
            <p class="auth-claim">Start a list.</p>
            <p class="auth-note">Projects hold related work. Tasks live inside a project.</p>
        </div>
        <p class="auth-note">Passwords need at least 8 characters.</p>
    </div>

    <main class="auth-form">
        <div class="auth-card">
            <div>
                <h1>Create account</h1>
                <p class="page-sub">Name, email, and a password.</p>
            </div>
            <form id="registerForm" novalidate>
                <div class="field">
                    <label class="field-label" for="name">Name</label>
                    <input class="input" id="name" type="text" autocomplete="name" required maxlength="80">
                </div>
                <div class="field">
                    <label class="field-label" for="email">Email</label>
                    <input class="input" id="email" type="email" autocomplete="email" required>
                </div>
                <div class="field">
                    <label class="field-label" for="password">Password</label>
                    <input class="input" id="password" type="password" autocomplete="new-password" minlength="8" required
                        aria-describedby="passwordHint">
                    <p class="field-hint" id="passwordHint">At least 8 characters.</p>
                </div>
                <div class="field">
                    <label class="field-label" for="password2">Confirm password</label>
                    <input class="input" id="password2" type="password" autocomplete="new-password" minlength="8" required>
                </div>
                <p class="form-msg" id="formMessage" role="alert"></p>
                <button class="btn" type="submit">Create account</button>
            </form>
            <div class="auth-foot">
                <span>Already registered?</span>
                <a class="link" href="login.html">Sign in</a>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
